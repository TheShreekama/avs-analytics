[theme]
base = "light"
primaryColor = "#0F6CBD"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1B1F"
font = "sans serif"

[server]
# Bind to loopback only — the app is never exposed on the network.
address = "localhost"
headless = true
port = 8501
enableXsrfProtection = true
maxUploadSize = 500
fileWatcherType = "none"

[browser]
# No telemetry / usage stats — nothing is sent anywhere.
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"
showErrorDetails = true
